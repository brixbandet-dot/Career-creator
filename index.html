<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5e6">
  <meta name="description" content="A side-scrolling game that teaches a tech career, built for players with dyslexia.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Career Creator</title>
</head>
<body>
  <div id="game" tabindex="-1" aria-label="Game area"></div>

  <header id="hud" class="hud" hidden>
    <button class="hudbtn" id="hud-map" type="button" aria-label="Back to map"><span aria-hidden="true">🗺️</span></button>
    <div class="hudmid">
      <span id="hud-zone" class="hudzone"></span>
      <span class="pill" aria-label="Sparks found"><span aria-hidden="true">✨</span> <span id="hud-sparks">0</span></span>
      <span class="pill" id="hud-level"></span>
    </div>
    <button class="hudbtn" id="hud-settings" type="button" aria-label="Reading settings"><span aria-hidden="true">⚙️</span></button>
  </header>

  <div id="touch" class="touch" hidden>
    <div class="pad">
      <button type="button" class="tbtn" data-ctl="left" aria-label="Move left">◀</button>
      <button type="button" class="tbtn" data-ctl="right" aria-label="Move right">▶</button>
    </div>
    <div class="pad">
      <button type="button" class="tbtn talk" data-ctl="talk" aria-label="Talk">💬</button>
      <button type="button" class="tbtn jump" data-ctl="jump" aria-label="Jump">⤒</button>
    </div>
  </div>

  <div id="screens"></div>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
